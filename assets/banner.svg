<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1147" />
    </linearGradient>

    <!-- Title Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter for Text Legibility -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#title-grad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #e2e8f0;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    
    /* Dynamic background animations */
    @keyframes pulse-node {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-card {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .anim-pulse {
      animation: pulse-node 4s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-pulse-delay {
      animation: pulse-node 5s ease-in-out 2s infinite;
      transform-origin: center;
    }
    .anim-float-1 {
      animation: float-card 6s ease-in-out infinite;
    }
    .anim-float-2 {
      animation: float-card 7s ease-in-out 1s infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="320" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Behind Text & Foreground) -->
  <g opacity="0.35">
    <!-- Grid pattern lines -->
    <path d="M0,80 H1000 M0,160 H1000 M0,240 H1000" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M200,0 V320 M400,0 V320 M600,0 V320 M800,0 V320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Animated Network Connection Lines -->
    <path d="M 650,220 Q 750,140 880,180" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 720,80 Q 820,120 900,90" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 6" />
  </g>

  <!-- Animated Background Orbs / Glow Nodes -->
  <circle cx="850" cy="100" r="90" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="anim-pulse" />
  <circle cx="750" cy="220" r="70" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="anim-pulse-delay" />

  <!-- Background Decorative Cloud Desktop Cards -->
  <g class="anim-float-1" opacity="0.4">
    <rect x="720" y="55" width="180" height="110" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <rect x="735" y="70" width="150" height="12" rx="4" fill="#3b82f6" opacity="0.7" />
    <rect x="735" y="92" width="90" height="8" rx="3" fill="#94a3b8" />
    <rect x="735" y="106" width="120" height="8" rx="3" fill="#64748b" />
    <rect x="735" y="120" width="70" height="8" rx="3" fill="#64748b" />
    <circle cx="880" cy="140" r="10" fill="#10b981" />
  </g>

  <g class="anim-float-2" opacity="0.35">
    <rect x="620" y="160" width="190" height="115" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <rect x="635" y="175" width="160" height="12" rx="4" fill="#8b5cf6" opacity="0.7" />
    <rect x="635" y="197" width="100" height="8" rx="3" fill="#94a3b8" />
    <rect x="635" y="211" width="130" height="8" rx="3" fill="#64748b" />
    <rect x="635" y="225" width="80" height="8" rx="3" fill="#64748b" />
    <circle cx="785" cy="245" r="10" fill="#06b6d4" />
  </g>

  <!-- FOREGROUND CONTENT (Always Remains Distinct & Readable) -->
  <g filter="url(#shadow)">
    <!-- Main Icon Badge -->
    <g transform="translate(60, 50)">
      <rect width="64" height="64" rx="16" fill="url(#accent-grad)" stroke="#818cf8" stroke-width="2" />
      <!-- Desktop Monitor Icon -->
      <path d="M 16,22 C 16,19 19,16 22,16 L 42,16 C 45,16 48,19 48,22 L 48,36 C 48,39 45,42 42,42 L 22,42 C 19,42 16,39 16,36 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 26,48 L 38,48 M 32,42 L 32,48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="40" cy="24" r="3" fill="#38bdf8" />
    </g>

    <!-- Header Title -->
    <text x="142" y="92" class="title-text">Awesome Desktop as a Service</text>

    <!-- Subtitle -->
    <text x="60" y="152" class="subtitle-text">Curated Directory of Cloud Desktops, VDI, Remote Workspaces &amp; Open-Source DaaS Stacks</text>

    <!-- Feature Pill Badges in Foreground -->
    <g transform="translate(60, 195)">
      <!-- Pill 1: SaaS Desktops -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#38bdf8" />
        <text x="34" y="22" class="badge-text">SaaS Platforms</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(157, 0)">
        <rect width="175" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#34d399" />
        <text x="34" y="22" class="badge-text">Open-Source DaaS</text>
      </g>

      <!-- Pill 3: VDI & Remote Desktop -->
      <g transform="translate(344, 0)">
        <rect width="170" height="34" rx="17" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#fbbf24" />
        <text x="34" y="22" class="badge-text">VDI &amp; Remote Access</text>
      </g>
    </g>

    <!-- Footer Stats / Last Updated Tag -->
    <text x="60" y="272" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      ⚡ Updated 2026 • Verified Enterprise Pricing &amp; Open Source Telemetry
    </text>
  </g>
</svg>
